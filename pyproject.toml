[project]
name = "biblindex-client"
version = "0.1.2"
description = "Python client for the BiblIndex API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Pierre Hennequart", email = "pierre@janalis.com" },
]
keywords = ["biblindex", "api", "client", "oauth2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.32",
]

[project.urls]
Homepage = "https://www.biblindex.org/api"
Source = "https://github.com/janalis/biblindex-client"
Issues = "https://github.com/janalis/biblindex-client/issues"

[dependency-groups]
# Used only by the example.py runner — not shipped to library consumers.
dev = [
    "dotenv-flow",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typecheck"},
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
]
lint = [
    "ruff>=0.6",
]
typecheck = [
    "mypy>=1.10",
    "types-requests>=2.32",
]
release = [
    "bump-my-version>=0.28",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "biblindex_client"
module-root = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["biblindex_client"]
source_pkgs = ["biblindex_client"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
# Lowest version current mypy supports; ruff's target-version = "py39"
# already enforces real 3.9 compatibility on the source.
python_version = "3.10"
strict = true
files = ["src/biblindex_client"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.bumpversion]
current_version = "0.1.2"
commit = true
tag = true
push = true
allow_dirty = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''name = "biblindex-client"
version = "{current_version}"'''
replace = '''name = "biblindex-client"
version = "{new_version}"'''
