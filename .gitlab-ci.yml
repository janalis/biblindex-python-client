# GitLab CI/CD — equivalent of .github/workflows/ci.yml and release.yml
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   DISCORD_WEBHOOK_URL  — Discord webhook (masked)
#   GITLAB_PUSH_TOKEN    — project/personal access token with write_repository
#                          scope, used by the manual version-bump job to push
#                          the bump commit and tag back (masked, protected)

stages:
  - test
  - build
  - release
  - notify

# Cancel superseded pipelines on the same ref (≈ GHA concurrency + cancel-in-progress)
default:
  interruptible: true

# Run for branch pushes, merge requests, tags, and manual/web triggers.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH

# ── Shared uv setup ─────────────────────────────────────────────────────────
.uv:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  after_script:
    - uv cache prune --ci

# ── Test (matrix over Python versions) ──────────────────────────────────────
test:
  extends: .uv
  stage: test
  image: ghcr.io/astral-sh/uv:python$PYTHON_VERSION-bookworm-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  script:
    - uv python install "$PYTHON_VERSION"
    - uv sync --group test --python "$PYTHON_VERSION"
    - uv run --python "$PYTHON_VERSION" pytest
        --cov=biblindex_client
        --cov-report=term-missing
        --cov-report=xml
        --junit-xml=test-results.xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

# ── Lint (ruff) ─────────────────────────────────────────────────────────────
lint:
  extends: .uv
  stage: test
  script:
    - uv sync --group lint
    - uv run ruff check .
    - uv run ruff format --check .

# ── Type-check (mypy) ───────────────────────────────────────────────────────
typecheck:
  extends: .uv
  stage: test
  script:
    - uv sync --group typecheck
    - uv run mypy

# ── Build distribution ──────────────────────────────────────────────────────
build:
  extends: .uv
  stage: build
  needs: ["test", "lint", "typecheck"]
  script:
    - uv build
  artifacts:
    paths:
      - dist/*
    expire_in: 1 week

# ── Release: manual version bump (≈ workflow_dispatch) ──────────────────────
# Trigger from CI/CD → Run pipeline on `main` with variable BUMP_PART=patch|minor|major.
bump:
  extends: .uv
  stage: release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $BUMP_PART && $CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - uv sync --group release
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
    - uv run bump-my-version bump "$BUMP_PART"
    # Feed the token via a credential helper so it never lands in the remote URL
    # (and thus never in git's logged output). GITLAB_PUSH_TOKEN stays env-only.
    - git remote set-url origin "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config credential.helper '!f() { echo "username=oauth2"; echo "password=$GITLAB_PUSH_TOKEN"; }; f'
    - git push origin "HEAD:${CI_COMMIT_BRANCH}"
    - git push origin --tags

# ── Release: cut a release on tag push (≈ tag "v*") ─────────────────────────
release:
  extends: .uv
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - uv build
  artifacts:
    paths:
      - dist/*
    expire_in: 1 month

release_publish:
  stage: release
  needs: ["release"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Publishing GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"

# ── Discord notifications ───────────────────────────────────────────────────
# The payload is assembled with jq so untrusted values (commit titles, author
# names) are JSON-escaped rather than interpolated into a raw string — a commit
# title with quotes or newlines can't break or forge the message.
.discord:
  stage: notify
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq

notify_failure:
  extends: .discord
  rules:
    - when: on_failure
  script:
    - |
      MESSAGE=$(printf '❌ Pipeline failed\nRepo: %s\nRef: %s\nCommit: %s\nAuthor: %s\n🔗 %s' \
        "$CI_PROJECT_PATH" "$CI_COMMIT_REF_NAME" "$CI_COMMIT_TITLE" "$GITLAB_USER_NAME" "$CI_PIPELINE_URL")
      jq -n --arg content "$MESSAGE" '{username: "GitLab CI", content: $content}' \
        | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d @-

notify_release:
  extends: .discord
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
  script:
    - |
      MESSAGE=$(printf '✅ Release %s published\nRepo: %s\nCommit: %s\nAuthor: %s\n🔗 %s' \
        "$CI_COMMIT_TAG" "$CI_PROJECT_PATH" "$CI_COMMIT_TITLE" "$GITLAB_USER_NAME" "$CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG")
      jq -n --arg content "$MESSAGE" '{username: "GitLab CI", content: $content}' \
        | curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d @-
