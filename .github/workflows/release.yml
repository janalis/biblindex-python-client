name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      part:
        description: Version part to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    name: Cut a new release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install release dependencies
        if: github.event_name == 'workflow_dispatch'
        run: uv sync --group release

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: uv run bump-my-version bump ${{ inputs.part }} --no-push

      - name: Push changes
        if: github.event_name == 'workflow_dispatch'
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin --tags

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NEW_VER=$(uv run bump-my-version show --format json | python -c 'import sys,json; print(json.load(sys.stdin)["current_version"])')
          else
            NEW_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        run: uv build

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.new_version }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          files: dist/*
