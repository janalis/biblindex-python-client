name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      part:
        description: Version part to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  prepare:
    name: Bump and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install release dependencies
        if: github.event_name == 'workflow_dispatch'
        run: uv sync --group release

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        run: uv run bump-my-version bump ${{ inputs.part }}

      - name: Push changes
        if: github.event_name == 'workflow_dispatch'
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin --tags

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NEW_VER=$(uv run bump-my-version show --format json | python -c 'import sys,json; print(json.load(sys.stdin)["current_version"])')
          else
            NEW_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: prepare
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        run: uv publish --index testpypi --trusted-publishing always

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [prepare, testpypi]
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [prepare, testpypi, pypi, github-release]
    if: always()
    steps:
      - name: Send failure message
        if: contains(needs.*.result, 'failure')
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
          message: |
            ❌ Release failed
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}
            🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send success message
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
          message: |
            ✅ Release ${{ needs.prepare.outputs.version }} published
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}
            🔗 https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }}
